# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: juanseperea
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: task-api
# "service" is the name of this project. This will also be added to your AWS resource names.
service: task-api

plugins:
  - serverless-auto-swagger

custom:
  autoswagger:
    title: 'Task API'
    apiType: 'httpApi'
    generateSwaggerOnDeploy: true
    typefiles:
      - './src/types/api-types.d.ts'

stages:
  default:
    params:
      tableName: "tasks-table-${sls:stage}"

provider:
  name: aws
  runtime: nodejs20.x
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
  httpApi:
    cors: true
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [TasksTable, Arn]
  environment:
    TASKS_TABLE: ${param:tableName}

functions:
  api:
    handler: handler.handler
    events:
      - httpApi:
          path: /health
          method: GET
          summary: Health check
          description: Check if the API is running
          responseData:
            200:
              description: API is healthy
      - httpApi:
          path: /tasks
          method: GET
          summary: Get all tasks
          description: Retrieve all tasks from the database
          responseData:
            200:
              description: List of all tasks
            500:
              description: Could not retrieve tasks
      - httpApi:
          path: /tasks
          method: POST
          summary: Create a new task
          description: Create a new task with a title
          bodyType: CreateTaskRequest
          responseData:
            200:
              description: Task created successfully
            400:
              description: Invalid input - title must be a string
            500:
              description: Could not create task
      - httpApi:
          path: /tasks/{taskId}
          method: GET
          summary: Get a task by ID
          description: Retrieve a specific task by its ID
          responseData:
            200:
              description: Task found
            404:
              description: Task not found
            500:
              description: Could not retrieve task
      - httpApi:
          path: /tasks/{taskId}
          method: PUT
          summary: Update a task
          description: Update an existing task's title or completed status
          bodyType: UpdateTaskRequest
          responseData:
            200:
              description: Task updated successfully
            400:
              description: Invalid input
            500:
              description: Could not update task
      - httpApi:
          path: /tasks/{taskId}
          method: DELETE
          summary: Delete a task
          description: Delete a task by its ID
          responseData:
            200:
              description: Task deleted successfully
            400:
              description: Task ID is required
            500:
              description: Could not delete task

resources:
  Resources:
    TasksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        AttributeDefinitions:
          - AttributeName: taskId
            AttributeType: S
        KeySchema:
          - AttributeName: taskId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
        TableName: ${param:tableName}
